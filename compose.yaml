services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uniz_hive
      POSTGRES_USER: uniz
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniz -d uniz_hive"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
